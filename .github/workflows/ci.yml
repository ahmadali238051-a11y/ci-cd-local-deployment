
name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Step 4: Test the FastAPI application
      - name: Run tests
        run: python -m pytest -v

      # Step 5: Prepare Docker image builder (main push only)
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Step 7: Build and push the Docker image
      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: w616/ci-cd-local-deployment:latest
      
      # Step 8. Start minikube
      - name: Start minikube
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: medyagh/setup-minikube@latest
      
      # Step 9. Deploying app to kubernetes
      - name: Deploy to kubernetes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/ci-cd-app --timeout=120s

      # Step 10. Verify Application Health
      
      - name: Verify application health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl port-forward deployment/ci-cd-app 8000:8000 > /tmp/port-forward.log 2>&1 &

          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "Application health check passed!"
              exit 0
            fi
            sleep 2
          done

          echo "Application health check failed"
          cat /tmp/port-forward.log
          exit 1

